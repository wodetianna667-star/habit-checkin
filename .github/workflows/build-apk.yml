name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "android/**"
      - "capacitor.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          sdkmanager --list_installed 2>/dev/null | grep -E "platforms;android-36|build-tools;36" | head

      - name: Build APK (debug)
        id: build
        continue-on-error: true
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log

      - name: Report error
        if: steps.build.outcome == 'failure'
        run: |
          awk '/FAILURE: Build failed/{p=1} p' /tmp/gradle.log | tr '\n' ' ' | head -c 6000 > /tmp/err.txt
          if [ ! -s /tmp/err.txt ]; then tail -150 /tmp/gradle.log | tr '\n' ' ' | head -c 6000 > /tmp/err.txt; fi
          echo "::error::$(cat /tmp/err.txt)"
          exit 1

      - name: Prepare APK
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p apk-output
          cp "$(find android/app/build/outputs -name '*.apk' | head -1)" apk-output/21tian.apk
          ls -la apk-output

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: 21tian-apk
          path: apk-output/21tian.apk
          if-no-files-found: error
